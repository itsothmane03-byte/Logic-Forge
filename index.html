<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fallacy Forge · Practice clearer thinking</title>
    <meta
      name="description"
      content="Spot weak arguments, choose stronger revisions, and solve short deduction puzzles. Free reasoning practice with a Daily Forge, local progress, and offline support."
    />
    <meta name="theme-color" content="#FAF8F4" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="./brand/favicon_32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./brand/favicon_16.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fallacy Forge" />
    <meta property="og:description" content="Spot weak arguments, make them stronger, and practice deduction. Free and open source." />
    <meta property="og:url" content="https://fallacyforge.com/" />
    <meta property="og:image" content="https://fallacyforge.com/brand/logo-512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply a saved light/dark theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('fallacyforge:v1') || 'null');
          var theme = saved && saved.settings && saved.settings.theme;
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div class="noscript" style="max-width: 560px; margin: 12vh auto; padding: 32px; font-family: system-ui, sans-serif; line-height: 1.55">
        <h1 style="margin: 0 0 12px">Fallacy Forge needs JavaScript</h1>
        <p>This practice app runs entirely in your browser, so it needs JavaScript turned on. Nothing is sent anywhere.</p>
        <p>
          You can read the source and the full question bank on GitHub:
          <a href="https://github.com/itsothmane03-byte/Logic-Forge">github.com/itsothmane03-byte/Logic-Forge</a>
        </p>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
